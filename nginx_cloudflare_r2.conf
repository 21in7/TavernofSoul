# Cloudflare 리디렉션 + nginx R2 캐시 최적화 설정
# /etc/nginx/sites-available/ktos 파일에 적용

upstream django2{
	server unix:/home/ubuntu/TavernofSoul/TavernofSoul/TavernofSoul/jtos.sock;
}

upstream django3{
	server unix:/home/ubuntu/TavernofSoul/TavernofSoul/TavernofSoul/ktos.sock;
}

upstream django{
	server unix:/home/ubuntu/TavernofSoul/TavernofSoul/TavernofSoul/itos.sock;
}

# 1. 캐시 존 설정 (nginx.conf에 추가 필요)
# proxy_cache_path /var/cache/nginx/r2_static
#     levels=1:2
#     keys_zone=r2_cache:50m
#     max_size=2g
#     inactive=720h;

# 2. HTTPS 서버 설정
server {
    listen 443 ssl;
    server_name gihyeonofsoul.com www.gihyeonofsoul.com
                 jtos.gihyeonofsoul.com www.jtos.gihyeonofsoul.com
                 itos.gihyeonofsoul.com www.itos.gihyeonofsoul.com;

    ssl_certificate /etc/nginx/ssl/gihyeonofsoul.com.pem;
    ssl_certificate_key /etc/nginx/ssl/gihyeonofsoul.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    charset utf-8;
    client_max_body_size 75M;

    # Cloudflare에서 리디렉션하는 /static/icons/* 경로
    # (Cloudflare가 https://r2.gihyeonofsoul.com/icons/${1}로 리디렉션)
    location ~ ^/static/icons/(.*)$ {
        # Cloudflare 리디렉션에 맡김 - nginx는 처리하지 않음
        # 요청이 여기까지 도달하면 로컬 fallback 사용
        alias /home/ubuntu/TavernofSoul/TavernofSoul/staticfiles_itos/icons/$1;

        # 캐시 설정 (짧게)
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Served-By "nginx-fallback";

        # 로깅
        access_log /var/log/nginx/r2_fallback.log;
    }

    # 다른 static 파일들은 nginx에서 R2로 프록시 (캐시 적용)
    location ~ ^/static/(?!icons/)(.*)$ {
        # R2 버킷으로 프록시
        proxy_pass https://r2.gihyeonofsoul.com/$1;

        # 캐시 설정
        proxy_cache r2_cache;
        proxy_cache_valid 200 302 30d;
        proxy_cache_valid 404 1h;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_background_update on;

        # 캐시 키
        proxy_cache_key "$scheme$request_method$host$request_uri";

        # 헤더
        proxy_set_header Host r2.gihyeonofsoul.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 압축
        gzip_vary on;
        gzip_proxied any;

        # 보안 헤더
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Served-By "nginx-r2-cache";

        # 로깅
        access_log /var/log/nginx/r2_cache.log cache_log;
    }

    # 기존 static location (fallback)
    location /static {
        alias /home/ubuntu/TavernofSoul/TavernofSoul/staticfiles_itos;

        # 캐시 설정
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Served-By "nginx-local";

        access_log /var/log/nginx/static_local.log;
    }

    # Django 앱들 (서브도메인별 라우팅)
    location / {
        # jtos 서브도메인
        if ($host ~* "^(www\.)?jtos\.gihyeonofsoul\.com$") {
            uwsgi_pass django2;
        }

        # ktos 서브도메인 (기본)
        if ($host ~* "^(www\.)?gihyeonofsoul\.com$|^(www\.)?ktos\.gihyeonofsoul\.com$") {
            uwsgi_pass django3;
        }

        # itos 서브도메인
        if ($host ~* "^(www\.)?itos\.gihyeonofsoul\.com$") {
            uwsgi_pass django;
        }

        include /etc/nginx/uwsgi_params;
    }
}

# HTTP to HTTPS 리디렉션
server {
    listen 80;
    server_name gihyeonofsoul.com www.gihyeonofsoul.com
                 jtos.gihyeonofsoul.com www.jtos.gihyeonofsoul.com
                 itos.gihyeonofsoul.com www.itos.gihyeonofsoul.com;

    return 301 https://$server_name$request_uri;
}

# 로그 포맷은 nginx.conf에 이미 정의됨
