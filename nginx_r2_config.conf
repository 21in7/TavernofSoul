# nginx R2 프록시 설정 예시
# /etc/nginx/sites-available/itos 파일에 추가

location /static {
    # R2 버킷으로 프록시
    proxy_pass https://your-r2-domain.r2.cloudflarestorage.com;
    proxy_set_header Host your-r2-domain.r2.cloudflarestorage.com;

    # 캐시 설정
    proxy_cache static_cache;
    proxy_cache_valid 200 302 1y;
    proxy_cache_valid 404 1m;
    add_header X-Cache-Status $upstream_cache_status always;

    # 보안 헤더
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    # CORS 설정 (필요시)
    add_header Access-Control-Allow-Origin *;

    # 에러 처리
    proxy_intercept_errors on;
    error_page 404 = /static/404.html;
}

# 캐시 존 설정 (nginx.conf에 추가)
