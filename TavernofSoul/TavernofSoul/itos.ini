[uwsgi]
# Plugin settings
plugin-dir = /usr/local/src/uwsgi-2.0.18
plugins = python38

# Django settings
module = TavernofSoul.wsgi_itos:application
chdir = /home/ubuntu/TavernofSoul/TavernofSoul
pythonpath = /home/ubuntu/TavernofSoul/TavernofSoul
virtualenv = /home/ubuntu/TavernofSoul/TavernofSoul/itos/3.8
env = DJANGO_SETTINGS_MODULE=TavernofSoul.settings_itos
master = true
processes = 4
threads = 2
vacuum = true
die-on-term = true
max-requests = 1000
harakiri = 60
pidfile = /home/ubuntu/TavernofSoul/TavernofSoul/TavernofSoul/itos.pid


# Socket settings
socket = /home/ubuntu/TavernofSoul/TavernofSoul/TavernofSoul/itos.sock
chmod-socket = 666
uid = www-data
gid = www-data

# Logging
logto = /var/log/TavernofSoul/itos/itos.log
touch-logreopen = /home/ubuntu/TavernofSoul/TavernofSoul/TavernofSoul/.touch_to_rotate
unique-cron = 0 0 -1 -1 -1 sh -c 'mv /var/log/TavernofSoul/itos/itos.log /var/log/TavernofSoul/itos/itos-$(date -d "yesterday" +%Y-%m-%d).log && touch /home/ubuntu/TavernofSoul/TavernofSoul/TavernofSoul/.touch_to_rotate'
unique-cron = 0 0 -1 -1 -1 sh -c 'mv /var/log/TavernofSoul/itos/itos.log /var/log/TavernofSoul/itos/itos-$(date -d "yesterday" +%Y-%m-%d).log && touch /home/ubuntu/TavernofSoul/TavernofSoul/TavernofSoul/.touch_to_rotate && find /var/log/TavernofSoul/itos/ -name "itos-*.log" -mtime +30 -delete'


