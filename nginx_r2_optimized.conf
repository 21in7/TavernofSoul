# R2 최적화된 nginx 설정 (프리티어 안전!)
# /etc/nginx/sites-available/itos 파일에 추가

# 1. 강력한 캐시 존 설정
proxy_cache_path /var/cache/nginx/r2_static
    levels=1:2
    keys_zone=r2_cache:50m
    max_size=2g
    inactive=720h
    use_temp_path=off;

# 2. R2 프록시 설정 (캐시 최적화)
location /static {
    # R2 버킷으로 프록시
    proxy_pass https://your-r2-domain.r2.cloudflarestorage.com;

    # 캐시 설정 (매우 공격적)
    proxy_cache r2_cache;
    proxy_cache_valid 200 302 30d;  # 30일 캐시
    proxy_cache_valid 404 1h;       # 404는 짧게
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;

    # 캐시 키 최적화
    proxy_cache_key "$scheme$request_method$host$request_uri";

    # 캐시 우회 조건 (필요시만)
    proxy_cache_bypass $http_upgrade $http_x_forwarded_proto;

    # 헤더 설정
    proxy_set_header Host your-r2-domain.r2.cloudflarestorage.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 압축 활성화
    gzip_vary on;
    gzip_proxied any;

    # 보안 헤더
    add_header X-Cache-Status $upstream_cache_status always;
    add_header Cache-Control "public, max-age=2592000" always;  # 30일
    add_header X-Content-Type-Options nosniff;
}

# 3. 캐시 퍼지 엔드포인트 (선택사항)
location /purge-static {
    allow 127.0.0.1;
    deny all;

    proxy_cache_purge r2_cache "$scheme$request_method$host$request_uri";
    proxy_pass https://your-r2-domain.r2.cloudflarestorage.com;
}

# 4. 캐시 상태 모니터링
location /nginx-cache-status {
    stub_status on;
    access_log off;
    allow 127.0.0.1;
    deny all;
}
