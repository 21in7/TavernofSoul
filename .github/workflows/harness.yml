name: Development harness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Chromium browser harness
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.8'
          cache: pip
          cache-dependency-path: harness/requirements.txt
      - name: Install harness dependencies
        run: python -m pip install -r harness/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: harness/browser/package-lock.json
          package-manager-cache: false
      - name: Install pinned browser SDK
        run: npm ci --prefix harness/browser --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and OS dependencies
        run: harness/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser gate
        run: make check-browser PYTHON=python
      - name: Upload browser results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-browser
          path: logs/harness/
          if-no-files-found: error
          retention-days: 14

  offline:
    name: Offline harness (SQLite)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.8'
          cache: pip
          cache-dependency-path: harness/requirements.txt
      - name: Install harness dependencies
        run: python -m pip install -r harness/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run offline gate
        run: make check PYTHON=python
      - name: Run reviewed real source sample gate
        run: make check-live PYTHON=python
      - name: Upload offline results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-offline
          path: logs/harness/
          if-no-files-found: error
          retention-days: 14

  mysql:
    name: MySQL harness
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
        env:
          MYSQL_ROOT_PASSWORD: harness-root-only
          MYSQL_DATABASE: tavern_harness
          MYSQL_USER: tavern_harness
          MYSQL_PASSWORD: harness-only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="MYSQL_PWD=harness-only mysql -h127.0.0.1 -utavern_harness tavern_harness -e 'SELECT 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      HARNESS_MYSQL_HOST: 127.0.0.1
      HARNESS_MYSQL_USER: tavern_harness
      HARNESS_MYSQL_PASSWORD: harness-only
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.8'
          cache: pip
          cache-dependency-path: harness/requirements.txt
      - name: Install harness dependencies
        run: python -m pip install -r harness/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Limit account to the two test schemas
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: >-
          docker exec -i "$MYSQL_CONTAINER" sh -c
          'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot' < harness/mysql-init.sql
      - name: Check MySQL environment
        env:
          HARNESS_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: make doctor-mysql PYTHON=python
      - name: Run MySQL gate
        env:
          HARNESS_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: make check-mysql PYTHON=python
      - name: Capture test server diagnostics
        if: failure()
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          mkdir -p logs/harness
          docker logs "$MYSQL_CONTAINER" > logs/harness/mysql-server.log 2>&1
      - name: Upload MySQL results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-mysql
          path: logs/harness/
          if-no-files-found: error
          retention-days: 14
