name: Development harness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    name: Select actual change validation
    runs-on: ubuntu-22.04
    outputs:
      docs_only: ${{ steps.select.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.8'
      - id: select
        name: Classify complete event diff
        run: python -m harness.docs_check --ci --selection-file validation-selection.json
      - name: Validate affected documentation
        if: steps.select.outputs.docs_only == 'true'
        run: python -m harness.docs_check --changes-file validation-selection.json --report docs-result.json
      - name: Preserve selection and documentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-selection
          path: |
            validation-selection.json
            docs-result.json
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Chromium browser execution
    needs: selection
    if: needs.selection.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.8'
          cache: pip
          cache-dependency-path: harness/requirements.txt
      - name: Install harness dependencies
        run: python -m pip install -r harness/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: harness/browser/package-lock.json
          package-manager-cache: false
      - name: Install pinned browser SDK
        run: npm ci --prefix harness/browser --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and OS dependencies
        run: harness/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser gate
        run: make check-browser PYTHON=python
      - name: Upload browser results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-browser
          path: logs/harness/
          if-no-files-found: error
          retention-days: 14

  offline:
    name: Offline execution (SQLite)
    needs: selection
    if: needs.selection.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.8'
          cache: pip
          cache-dependency-path: harness/requirements.txt
      - name: Install harness dependencies
        run: python -m pip install -r harness/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run offline gate
        run: make check PYTHON=python
      - name: Run reviewed real source sample gate
        run: make check-live PYTHON=python
      - name: Upload offline results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-offline
          path: logs/harness/
          if-no-files-found: error
          retention-days: 14

  mysql:
    name: MySQL execution
    needs: selection
    if: needs.selection.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
        env:
          MYSQL_ROOT_PASSWORD: harness-root-only
          MYSQL_DATABASE: tavern_harness
          MYSQL_USER: tavern_harness
          MYSQL_PASSWORD: harness-only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="MYSQL_PWD=harness-only mysql -h127.0.0.1 -utavern_harness tavern_harness -e 'SELECT 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      HARNESS_MYSQL_HOST: 127.0.0.1
      HARNESS_MYSQL_USER: tavern_harness
      HARNESS_MYSQL_PASSWORD: harness-only
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.8'
          cache: pip
          cache-dependency-path: harness/requirements.txt
      - name: Install harness dependencies
        run: python -m pip install -r harness/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Limit account to the two test schemas
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: >-
          docker exec -i "$MYSQL_CONTAINER" sh -c
          'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot' < harness/mysql-init.sql
      - name: Check MySQL environment
        env:
          HARNESS_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: make doctor-mysql PYTHON=python
      - name: Run MySQL gate
        env:
          HARNESS_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: make check-mysql PYTHON=python
      - name: Capture test server diagnostics
        if: failure()
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          mkdir -p logs/harness
          docker logs "$MYSQL_CONTAINER" > logs/harness/mysql-server.log 2>&1
      - name: Upload MySQL results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-mysql
          path: logs/harness/
          if-no-files-found: error
          retention-days: 14

  required:
    name: ${{ matrix.name }}
    if: always()
    needs: [selection, offline, mysql, browser]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Offline harness (SQLite)
            execution: offline
          - name: MySQL harness
            execution: mysql
          - name: Chromium browser harness
            execution: browser
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validation-selection
          path: evidence
      - name: Require real documentation or full execution success
        env:
          SELECTION_RESULT: ${{ needs.selection.result }}
          DOCS_ONLY: ${{ needs.selection.outputs.docs_only }}
          EXECUTION_RESULT: ${{ needs[matrix.execution].result }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          if os.environ['SELECTION_RESULT'] != 'success':
              raise SystemExit('Change selection or documentation validation failed')
          selection = json.loads(Path('evidence/validation-selection.json').read_text())
          if os.environ['DOCS_ONLY'] == 'true':
              report = json.loads(Path('evidence/docs-result.json').read_text())
              groups = report.get('checks')
              ok = (selection.get('mode') == 'docs' and bool(selection.get('changes')) and
                    report.get('selection') == selection and report.get('status') == 'passed' and
                    isinstance(groups, dict) and bool(groups) and all(
                        g.get('status') == 'passed' and type(g.get('selected')) is int and
                        g['selected'] > 0 and type(g.get('passed')) is int and
                        g['passed'] == g['selected'] and not g.get('skipped') and
                        not g.get('failures') and not g.get('errors') for g in groups.values()))
              if not ok:
                  raise SystemExit('Required documentation evidence is incomplete')
              print('Required gate passed with selected/passed, zero-skip documentation evidence')
          elif selection.get('mode') != 'full' or os.environ['EXECUTION_RESULT'] != 'success':
              raise SystemExit('Required full execution failed or did not run')
          else:
              print('Required gate passed with full execution success')
          PYCODE
